<!doctype html>
<html lang="pt-BR">

  <head>
    <script>
      /* aplica o tema salvo antes de desenhar a tela (evita piscar branco) */
      (function () {
        try {
          var m = localStorage.getItem('sh-theme') || 'auto', h = new Date().getHours();
          var dark = m === 'escuro' || (m === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches) || (m === 'noturno' && (h >= 18 || h < 6));
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>

    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>Cifras Shalom</title>

    <!-- FAVICON -->
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/brand/logo-mark-blue.png"
    />

    <!-- PWA -->
    <link
      rel="manifest"
      href="/manifest.json"
    />

    <!-- BRAND COLORS -->
    <meta
      name="theme-color"
      content="#F64E03"
    />

    <!-- IOS -->
    <link
      rel="apple-touch-icon"
      href="/brand/logo-mark-blue.png"
    />

    <meta
      name="mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="Cifras Shalom"
    />

    <!-- DESCRIPTION -->
    <meta
      name="description"
      content="Cifras Shalom - Repertório, cifras e músicas para servir através da música."
    />

  </head>

  <body>

    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>

  </body>

</html>
